name: s1reader
channels:
  - conda-forge
dependencies:
  - python>=3.8
  - numpy>=1.20
  - gdal>=3.0
  - isce3>=0.13
  - packaging>=21.0
  - requests>=2.0
  - shapely>=1.8
  - lxml>=4.8
  # zarr is optional (EOPF-CPM zarr reader); install via `pip install .[zarr]`
  # or add `zarr` here if you need s1reader.s1_reader_zarr.
